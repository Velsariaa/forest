plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.example.paddy_scan"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = "25.1.8937393"
    flavorDimensions "default"
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
        coreLibraryDesugaringEnabled true
    }

    dependencies {
        coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:1.2.2' // Latest version might be different
        implementation 'org.tensorflow:tensorflow-lite:2.11.0'
        implementation 'org.tensorflow:tensorflow-lite-gpu:2.11.0'
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.example.paddy_scan"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
        }
    }
    productFlavors {
        ML1PaddyScan1 {
            dimension "default"
            applicationIdSuffix ".ml1paddyscan1"
            resValue "string", "app_name", "ML1PaddyScan1"
        }
        ML1PaddyScan2 {
            dimension "default"
            applicationIdSuffix ".ml1paddyscan2"
            resValue "string", "app_name", "ML1PaddyScan2"
        }
        ML1PaddyScan3 {
            dimension "default"
            applicationIdSuffix ".ml1paddyscan3"
            resValue "string", "app_name", "ML1PaddyScan3"
        }
        ML2PaddyScan1 {
            dimension "default"
            applicationIdSuffix ".ml2paddyscan1"
            resValue "string", "app_name", "ML2PaddyScan1"
        }
        ML2PaddyScan2 {
            dimension "default"
            applicationIdSuffix ".ml2paddyscan2"
            resValue "string", "app_name", "ML2PaddyScan2"
        }
        ML2PaddyScan3 {
            dimension "default"
            applicationIdSuffix ".ml2paddyscan3"
            resValue "string", "app_name", "ML2PaddyScan3"
        }
    }
}

flutter {
    source = "../.."
}